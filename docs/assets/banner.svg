<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Deal4Me: your agent finds and negotiates the best local deals in Salt Lake. Winner, Best Use of AI, Crimson Hack 2026.</title>
  <desc id="d">Animated banner on a dark ink background. On the left: the Deal4Me peak logo mark and wordmark, the tagline "Your agent finds and negotiates the best local deals in Salt Lake.", and a crimson award pill with a trophy reading "Winner · Best Use of AI · Crimson Hack 2026". A faint Wasatch ridgeline runs along the bottom and draws itself in from left to right. On the right, a 12 second loop shows a price tag for all-mountain skis listed at $45 per day while two agents haggle in chat bubbles: your agent (glacier blue) offers $34, the shop agent counters at $42, your agent offers $38, and the shop agent meets at $40. The price on the tag ticks down from $45 to $42 to $40, then the tag settles on a crimson Deal pill, the old $45 struck through, and a green check. The resting frame shows the agreed deal at $40.</desc>
  <style>
.a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.fb{transform-box:fill-box;transform-origin:center}
.num{font-variant-numeric:tabular-nums}
.buy1{opacity:0;animation-name:buy1}
.sel1{opacity:0;animation-name:sel1}
.buy2{animation-name:buy2}
.sel2{animation-name:sel2}
.p45{opacity:0;animation-name:p45}
.p42{opacity:0;animation-name:p42}
.p40{fill:#b4232a;animation-name:p40}
.nego{opacity:0;animation-name:nego}
.deal{animation-name:deal}
.strike{animation-name:strike}
.check{animation-name:check}
.ridge{stroke-dasharray:1425 1425;stroke-dashoffset:0;animation-name:ridge}
@keyframes buy1{0%{opacity:0;transform:translateY(8px)}18.333%{opacity:0;transform:translateY(8px)}22.083%{opacity:1;transform:translateY(0)}44.167%{opacity:1;transform:translateY(0)}46.667%{opacity:0;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-6px)}}
@keyframes sel1{0%{opacity:0;transform:translateY(8px)}29.167%{opacity:0;transform:translateY(8px)}32.917%{opacity:1;transform:translateY(0)}44.167%{opacity:1;transform:translateY(0)}46.667%{opacity:0;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-6px)}}
@keyframes buy2{0%{opacity:1;transform:translateY(0)}8.333%{opacity:1;transform:translateY(0)}11.25%{opacity:0;transform:translateY(-6px)}48.75%{opacity:0;transform:translateY(8px)}52.5%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes sel2{0%{opacity:1;transform:translateY(0)}8.333%{opacity:1;transform:translateY(0)}11.25%{opacity:0;transform:translateY(-6px)}59.167%{opacity:0;transform:translateY(8px)}62.917%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes p45{0%{opacity:0;transform:translateY(-14px)}10%{opacity:0;transform:translateY(-14px)}12.917%{opacity:1;transform:translateY(0)}30.833%{opacity:1;transform:translateY(0)}32.917%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes p42{0%{opacity:0;transform:translateY(14px)}32.5%{opacity:0;transform:translateY(14px)}35%{opacity:1;transform:translateY(0)}60.833%{opacity:1;transform:translateY(0)}62.917%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes p40{0%{opacity:1;transform:translateY(0);fill:#b4232a}8.333%{opacity:1;transform:translateY(0);fill:#b4232a}10.417%{opacity:0;transform:translateY(14px);fill:#b4232a}11.25%{opacity:0;transform:translateY(14px);fill:#16181d}62.5%{opacity:0;transform:translateY(14px);fill:#16181d}65%{opacity:1;transform:translateY(0);fill:#16181d}70%{opacity:1;transform:translateY(0);fill:#16181d}73.333%{opacity:1;transform:translateY(0);fill:#b4232a}100%{opacity:1;transform:translateY(0);fill:#b4232a}}
@keyframes nego{0%{opacity:0}11.667%{opacity:0}14.167%{opacity:1}69.167%{opacity:1}70.833%{opacity:0}100%{opacity:0}}
@keyframes deal{0%{opacity:1;transform:scale(1)}8.333%{opacity:1;transform:scale(1)}10.833%{opacity:0;transform:scale(.92)}70.833%{opacity:0;transform:scale(.92)}73.75%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
@keyframes strike{0%{opacity:1}8.333%{opacity:1}10.417%{opacity:0}72.5%{opacity:0}75%{opacity:1}100%{opacity:1}}
@keyframes check{0%{opacity:1;transform:scale(1)}8.333%{opacity:1;transform:scale(1)}10.833%{opacity:0;transform:scale(.6)}72.917%{opacity:0;transform:scale(.6)}75.833%{opacity:1;transform:scale(1.08)}77.917%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
@keyframes ridge{0%{stroke-dashoffset:0}8.333%{stroke-dashoffset:0}20%{stroke-dashoffset:-1425}40%{stroke-dashoffset:-2850}100%{stroke-dashoffset:-2850}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
